<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Personal mark for S. Bala Raju
    Concept: Geometric "B" formed from a bold vertical stem
    + two stacked half-arcs (negative-space interpretation).
    Light background, deep ink + single violet accent.
    Readable at 16×16.
  -->

  <!-- Very light warm-white background -->
  <rect width="32" height="32" rx="6" fill="#F8F7FF"/>

  <!-- Vertical stem of B — deep ink, bold -->
  <rect x="7" y="6" width="3.5" height="20" rx="1.5" fill="#0E0F1A"/>

  <!-- Upper arc — top half of B (solid ink) -->
  <path
    d="M 10.5 6 L 18 6 Q 23 6 23 11.5 Q 23 17 10.5 17"
    stroke="#0E0F1A"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Lower arc — bottom half of B (violet accent) -->
  <path
    d="M 10.5 17 L 19 17 Q 25 17 25 22.5 Q 25 29 10.5 26"
    stroke="#5B50DC"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
