<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0e0f1a"/>
  <!-- Letter B with gradient and glow -->
  <text
    x="16" y="22"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="20"
    text-anchor="middle"
    fill="url(#bGrad)"
    filter="url(#glow)"
  >B</text>
  <!-- Underline accent -->
  <line x1="10" y1="25.5" x2="22" y2="25.5" stroke="#6366f1" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
</svg>
