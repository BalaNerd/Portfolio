<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Brand Gradient: Electric Indigo to Vivid Cyan -->
    <linearGradient id="brGrad" x1="6" y1="5" x2="26" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Left Spine (Deep Charcoal) -->
  <path d="M7 5V27" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Top Geometric Loop of 'B' (Electric Indigo) -->
  <path d="M7 6.75H17C20.45 6.75 23 8.75 23 11.5C23 14.25 20.45 16.25 17 16.25H7" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower Dynamic Loop & Kick of 'R' (Vivid Gradient Cyan/Violet) -->
  <path d="M14 16.25H18C21.45 16.25 24 18.25 24 21C24 23.75 21.45 25.75 18 25.75H7" stroke="url(#brGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dynamic R Kinetic Terminal -->
  <path d="M15.5 16.25L24.5 26.5" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
</svg>
